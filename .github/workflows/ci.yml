name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # No database, no network: unit tests must be fully hermetic.
      - run: npm test
      # Coverage thresholds are enforced, not merely reported — a bare
      # --experimental-test-coverage run prints a table and exits 0 no
      # matter how low the numbers are.
      - name: Coverage gate (overall)
        run: npm run test:coverage
      # The order book is pure logic with no I/O and is meant to be
      # extractable as a standalone package, so it is held to a much
      # higher bar than the app around it.
      - name: Coverage gate (order book)
        run: npm run test:coverage:engine

  integration:
    name: Integration tests (Mongo)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/nockmarket
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --wait
      - run: curl -f http://localhost:3000/healthz
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
